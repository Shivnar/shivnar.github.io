<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Satya's Trading Journal</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: radial-gradient(700px 470px at 50% -8%, rgba(28,73,82,.24), transparent 70%), linear-gradient(180deg, #0b121a, #0a1017 70%, #0a1016) fixed;
  background-attachment: fixed;
  color: #e6edf3;
  padding-bottom: 90px;
}
.page { display: none; padding: 15px; max-width: 500px; margin: 0 auto; }
.page.active { display: block; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* market tabs */
.tabs { display: flex; background: rgba(22,27,34,.85); backdrop-filter: blur(10px); border: 1px solid #30363d; border-radius: 14px; padding: 5px; margin-bottom: 16px; }
.tab { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; color: #8b949e; cursor: pointer; font-weight: 600; transition: all .2s; }
.tab.active { background: linear-gradient(135deg, #2ea043, #238636); color: white; box-shadow: 0 2px 10px rgba(46,160,67,.35); }

/* cards: glass */
.card { background: linear-gradient(180deg, rgba(30,38,47,.9), rgba(22,27,34,.9)); border: 1px solid rgba(139,148,158,.18); border-radius: 16px; padding: 16px; margin: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.sub { color: #8b949e; font-size: 13px; line-height: 1.5; }
input, button, select { padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; width: 100%; outline: none; transition: border .2s; }
input:focus { border-color: #2ea043; }
button { background: linear-gradient(135deg, #2ea043, #238636); color: white; cursor: pointer; border: none; font-weight: 600; transition: transform .15s, filter .2s; }
button:active { transform: scale(.97); }
button.plain { background: #21262d; }
button.danger { background: linear-gradient(135deg, #da3633, #b62324); }
button.blue { background: linear-gradient(135deg, #388bfd, #1f6feb); }
.full { width: 100%; }

/* day group cards */
.day {
  background: linear-gradient(180deg, rgba(30,38,47,.95), rgba(22,27,34,.95));
  border: 1px solid rgba(139,148,158,.15);
  border-left: 4px solid #2ea043;
  border-radius: 14px; padding: 14px 16px; margin: 10px 0;
  display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  transition: transform .15s, box-shadow .2s;
}
.day:hover { box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.day:active { transform: scale(.985); }
.day.loss { border-left-color: #f85149; }
.day .d { font-weight: 700; }
.day .dow { color: #8b949e; font-size: 12px; font-weight: 400; }
.day .p { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.day .n { color: #8b949e; font-size: 12px; text-align: right; font-weight: 400; }
.profit { color: #3fb950; } .loss2 { color: #f85149; }
.trade-row { display: flex; justify-content: space-between; padding: 9px 14px; background: rgba(13,17,23,.9); border: 1px solid rgba(139,148,158,.1); border-radius: 10px; margin: 6px 0; font-size: 14px; }
.day-detail { display: none; }

/* stats */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px; }
.stat { background: linear-gradient(180deg, rgba(30,38,47,.95), rgba(22,27,34,.95)); border: 1px solid rgba(139,148,158,.15); border-radius: 14px; padding: 16px; text-align: center; }
.stat .num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat .lbl { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

/* fab + nav */
#fab { position: fixed; right: 20px; bottom: 96px; width: 60px; height: 60px; border-radius: 50%; font-size: 30px; background: #2ea043; box-shadow: 0 6px 20px rgba(46,160,67,.45); z-index: 20; }
.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(22,27,34,.92); backdrop-filter: blur(12px); border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 8px 0 14px; }
.bottomnav button { background: none; color: #8b949e; font-size: 11px; width: auto; transition: color .2s; }
.bottomnav button span { display: block; font-size: 20px; }
.bottomnav .active { color: #3fb950; }

/* popup form */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(3px); z-index: 30; overflow-y: auto; }
.overlay.open { display: flex; align-items: flex-end; justify-content: center; animation: fadein .2s ease; }
.sheet { background: #161b22; border-radius: 20px 20px 0 0; padding: 22px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; border-top: 1px solid rgba(139,148,158,.2); }
.form-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.form-head h3 { font-size:20px; }
.form-head .close-form { width:38px; height:38px; padding:0; margin:0; border-radius:50%; background:#21262d; font-size:20px; }
.form-label { display:block; color:#c9d1d9; font-size:13px; font-weight:650; margin:14px 0 5px; }
.choice-row { display:flex; gap:7px; }
.choice { flex:1; width:auto; margin:0; padding:10px 6px; border:1px solid #30363d; background:#21262d; color:#c9d1d9; font-size:13px; white-space:nowrap; }
.choice.active { background:#1f6feb; border-color:#388bfd; color:white; }
.choice-row.market-choices { flex-wrap:wrap; }
.choice-row.market-choices .choice { flex:1 1 calc(50% - 7px); }
.direction-row { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:4px; border-radius:12px; background:#0d1117; }
.direction-row .choice { border:0; }
.direction-row .choice.active.short { background:#da3633; }
.form-field { background:#21262d; border:1px solid #30363d; margin:0; }
.field-pair { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:end; }
.field-pair input { min-width:0; }
.sell-head { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.sell-head .form-label { margin:0; }
.add-sell { width:auto; padding:6px 8px; margin:0; background:transparent; color:#58a6ff; }
.sell-row { display:grid; grid-template-columns:1fr 1fr 38px; gap:8px; align-items:end; margin:7px 0; }
.sell-row .form-label { font-size:11px; margin:0 0 3px; }
.sell-row input { min-width:0; margin:0; }
.remove-sell { width:36px; height:42px; padding:0; margin:0; border-radius:50%; background:rgba(248,81,73,.15); color:#f85149; font-size:21px; }
.leverage-choices { flex-wrap:wrap; }
.leverage-choices .choice { flex:1 1 14%; }
.preview-box { display:flex; justify-content:space-between; padding:13px; margin-top:14px; border-radius:12px; background:#0d1117; color:#c9d1d9; font-size:13px; }
.preview-box b { display:block; margin-top:4px; font-size:18px; color:#3fb950; }
.photo-list { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px; }
.photo-preview { position:relative; }
.photo-preview img { width:100%; height:86px; object-fit:cover; border-radius:9px; }
.photo-preview button { position:absolute; right:2px; top:2px; width:24px; height:24px; margin:0; padding:0; border-radius:50%; background:#b62324; }
.photo-empty { padding:16px; text-align:center; background:#0d1117; color:#8b949e; border:1px dashed #30363d; border-radius:10px; font-size:13px; }
#saveBtn { margin-top:18px; }

/* profile tab: polished navy surfaces with a restrained teal signature */
#page-profile { width: min(100%, 540px); padding: 18px 20px 32px; color: #e7eef6; }
#page-profile .profile-head { position: relative; display: flex; align-items: center; gap: 16px; padding: 21px 18px; margin: 0 0 27px; overflow: hidden; text-align: left; background: radial-gradient(ellipse at 100% 0%, rgba(63,181,165,.17), transparent 52%), linear-gradient(145deg, rgba(27,44,59,.98), rgba(17,28,40,.98)); border: 1px solid rgba(107,145,161,.23); border-radius: 22px; box-shadow: 0 14px 34px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.035); }
#page-profile .profile-head::after { content: ""; position: absolute; width: 116px; height: 116px; right: -40px; bottom: -76px; border: 1px solid rgba(85,199,178,.18); border-radius: 50%; box-shadow: 0 0 0 14px rgba(85,199,178,.035), 0 0 0 29px rgba(85,199,178,.025); pointer-events: none; }
#page-profile .profile-avatar { display: grid; place-items: center; flex: 0 0 62px; width: 62px; height: 62px; color: #8ce4d2; background: linear-gradient(145deg, rgba(85,199,178,.2), rgba(85,199,178,.07)); border: 1px solid rgba(113,224,202,.42); border-radius: 19px; box-shadow: inset 0 1px rgba(255,255,255,.08), 0 7px 18px rgba(0,0,0,.17); }
#page-profile .profile-avatar svg { width: 29px; height: 29px; }
#page-profile .profile-identity { min-width: 0; }
#page-profile .profile-title { color: #83d9ca; font-size: 10px; line-height: 1.2; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase; margin: 0 0 7px; }
#page-profile .profile-name { color: #f5f8fb; font-size: clamp(19px, 5vw, 23px); line-height: 1.2; font-weight: 720; letter-spacing: -.45px; }
#page-profile .profile-email { color: #a6b6c5; font-size: 12px; line-height: 1.45; margin-top: 5px; overflow-wrap: anywhere; }
#page-profile .profile-section { display: flex; align-items: center; gap: 9px; margin: 0 3px 11px; color: #b6c5d1; font-size: 10px; font-weight: 800; letter-spacing: 1.55px; text-transform: uppercase; }
#page-profile .profile-section::before { content: ""; width: 3px; height: 13px; border-radius: 4px; background: linear-gradient(180deg, #75dfca, #318f8b); box-shadow: 0 0 10px rgba(85,199,178,.4); }
#page-profile .profile-card { margin: 0 0 24px; padding: 5px 15px; overflow: hidden; background: linear-gradient(155deg, rgba(25,39,52,.97), rgba(16,27,39,.98)); border: 1px solid rgba(107,145,161,.2); border-radius: 17px; box-shadow: 0 10px 26px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.035); }
#page-profile .profile-action { position: relative; display: flex; align-items: center; gap: 13px; width: 100%; min-height: 62px; padding: 10px 3px; margin: 0; background: transparent; border: 0; border-bottom: 1px solid rgba(148,163,184,.13); border-radius: 0; text-align: left; color: #e5edf4; transition: background .2s ease, transform .16s ease; }
#page-profile .profile-action:last-child { border-bottom: 0; }
#page-profile .profile-action:hover { background: linear-gradient(90deg, rgba(85,199,178,.075), transparent 90%); }
#page-profile .profile-action:active { transform: scale(.99); }
#page-profile .profile-action:focus-visible { outline: 2px solid #55c7b2; outline-offset: -2px; border-radius: 8px; }
#page-profile .profile-icon { display: grid; place-items: center; flex: 0 0 36px; width: 36px; height: 36px; color: #74d8c5; background: linear-gradient(145deg, rgba(85,199,178,.14), rgba(85,199,178,.055)); border: 1px solid rgba(85,199,178,.12); border-radius: 12px; }
#page-profile .profile-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#page-profile .profile-copy { flex: 1; min-width: 0; }
#page-profile .profile-copy strong { display: block; font-size: 13px; line-height: 1.3; font-weight: 650; letter-spacing: .05px; }
#page-profile .profile-copy small { display: block; margin-top: 3px; color: #8fa1b1; font-size: 11px; line-height: 1.4; font-weight: 400; }
#page-profile .profile-chevron { display: grid; place-items: center; flex: 0 0 24px; width: 24px; height: 24px; color: #7890a1; font-size: 21px; font-weight: 300; transition: color .2s, transform .2s; }
#page-profile .profile-action:hover .profile-chevron { color: #82decd; transform: translateX(2px); }
#page-profile .profile-action.signout { color: #ffaaa8; }
#page-profile .profile-action.signout .profile-icon { color: #ff8f8c; background: rgba(248,81,73,.09); border-color: rgba(248,81,73,.14); }
#page-profile .profile-action.signout .profile-copy small { color: #a88f94; }
body.profile-view { background: radial-gradient(700px 470px at 50% -8%, rgba(28,73,82,.34), transparent 70%), linear-gradient(180deg, #0b121a, #0a1017 70%, #0a1016) fixed; color: #e6edf3; }
body.profile-view .bottomnav { background: rgba(12,20,29,.94); border-top-color: rgba(107,145,161,.19); box-shadow: 0 -8px 24px rgba(0,0,0,.2); }
body.profile-view .bottomnav button { color: #91a3b2; }
body.profile-view .bottomnav .active { color: #6ed5c2; }
@media (max-width: 380px) {
  #page-profile { padding: 13px 14px 27px; }
  #page-profile .profile-head { gap: 12px; padding: 17px 14px; margin-bottom: 23px; border-radius: 19px; }
  #page-profile .profile-avatar { flex-basis: 54px; width: 54px; height: 54px; border-radius: 16px; }
  #page-profile .profile-card { padding: 4px 11px; margin-bottom: 20px; }
  #page-profile .profile-action { gap: 10px; min-height: 59px; }
  #page-profile .profile-copy strong { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #page-profile *, #page-profile *::before, #page-profile *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.settings-back { margin: 4px 0 14px; }
/* pin lock */
.lockscreen { position: fixed; inset: 0; background: rgba(10,14,15,.98); z-index: 100; display: flex; align-items: center; justify-content: center; }
.lockbox { width: 88%; max-width: 340px; text-align: center; }
.lockbox h3 { margin-bottom: 14px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- HOME TAB -->
  <div id="page-home" class="page active">
      <div class="tabs">
      <button class="tab" onclick="setMarket('Stock', this)">Stock</button>
      <button class="tab" onclick="setMarket('Crypto', this)">Crypto</button>
      <button class="tab active" onclick="setMarket('Forex', this)">Forex</button>
      <button class="tab" onclick="setMarket('Commodities', this)">Commodities</button>
    </div>
    <div id="dayList"></div>
  </div>

    <!-- JOURNAL TAB (all trades) -->
  <div id="page-journal" class="page">
    <div id="journalList"></div>
  </div>

<!-- DASHBOARD TAB -->
  <div id="page-dashboard" class="page">
    <div class="stats-grid" id="stats"></div>
    <div class="card"><canvas id="chart" height="220"></canvas></div>
    <div class="card"><canvas id="stockChart" height="220"></canvas></div>
  </div>

  <!-- PROFILE TAB -->
  <div id="page-profile" class="page">
    <div class="profile-head">
      <div class="profile-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path></svg></div>
      <div class="profile-identity">
        <h1 class="profile-title">Your profile</h1>
        <div class="profile-name">Satya Nigam roy</div>
        <p class="profile-email" id="profileEmail">Trading journal account</p>
      </div>
    </div>

    <div class="profile-section">Manage</div>
    <div class="card profile-card">
      <button class="profile-action" onclick="showStrategies()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9m6 7V5m6 11v-4"></path><circle cx="6" cy="7" r="1.5"></circle><circle cx="12" cy="3.5" r="1.5"></circle><circle cx="18" cy="10" r="1.5"></circle></svg></span><span class="profile-copy"><strong>Strategy</strong><small>Your trading setups</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
      <button class="profile-action" onclick="downloadCSV()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5"></path><path d="M5 16v4h14v-4"></path></svg></span><span class="profile-copy"><strong>Download Reports</strong><small>Export your journal data</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
      <button class="profile-action" onclick="goSettings()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.5-1.7-1v-2.4l1.7-1-1.5-2.5-1.9.5a7 7 0 0 0-2.1-1.2L13.5 3h-3l-.4 2.1A7 7 0 0 0 8 6.3l-1.9-.5-1.5 2.5 1.7 1v2.4l-1.7 1 1.5 2.5 1.9-.5a7 7 0 0 0 2.1 1.2l.4 2.1h3l.4-2.1a7 7 0 0 0 1.5-.9"></path></svg></span><span class="profile-copy"><strong>Settings</strong><small>Data and app preferences</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
    </div>

    <div class="profile-section">Support</div>
    <div class="card profile-card">
      <button class="profile-action" onclick="requestFeature()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-5-6a6 6 0 1 1 6 0c-.8.6-1 1.2-1 2h-4c0-.8-.2-1.4-1-2Z"></path><path d="M12 2v1"></path></svg></span><span class="profile-copy"><strong>Request New Feature</strong><small>Share an idea for the journal</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
      <button class="profile-action" onclick="shareApp()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 5h5v5"></path><path d="m19 5-9 9"></path><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></span><span class="profile-copy"><strong>Share App</strong><small>Send the journal to someone</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
      <button class="profile-action" onclick="reportBug()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5m0 3h.01"></path><path d="M10.3 3.8 2.9 17a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"></path></svg></span><span class="profile-copy"><strong>Bug Report</strong><small>Tell us if something feels off</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
    </div>

    <div class="profile-section">Account</div>
    <div class="card profile-card">
      <button class="profile-action signout" onclick="doLogout()">
        <span class="profile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"></path><path d="M15 12H4"></path><path d="M20 4v16"></path></svg></span><span class="profile-copy"><strong>Sign Out</strong><small>Sign out from this account</small></span><span class="profile-chevron" aria-hidden="true">›</span>
      </button>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="page-settings" class="page">
    <button class="plain settings-back" onclick="go('profile', document.querySelector('.bottomnav button[data-page=profile]'))">‹ Back to Profile</button>
    <div class="card">
      <h3>Data</h3>
      <button class="blue full" onclick="downloadCSV()">Download CSV</button>
      <p class="sub" id="userEmail" style="margin:4px 0"></p>
      <button class="blue full" onclick="backupData()">Backup (file save karo)</button>
      <button class="blue full" onclick="document.getElementById('restoreFile').click()">Restore backup</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(this)">
      <button class="danger full" onclick="wipeAll()">Delete all trades</button>
    </div>
    <div class="card"><p class="sub">Made with HTML, CSS &amp; JS. Data aapke phone me hi save hota hai.</p></div>
  </div>

  <!-- ADD TRADE FORM (popup) -->
  <div id="formOverlay" class="overlay">
    <div class="sheet">
      <div class="form-head"><h3 id="formTitle">New Journal</h3><button type="button" class="close-form" aria-label="Close" onclick="closeForm()">×</button></div>
      <label class="form-label">Market</label>
      <div class="choice-row market-choices" id="formMarkets">
        <button type="button" class="choice active" data-market="Stock" onclick="selectFormMarket('Stock')">Stock</button>
        <button type="button" class="choice" data-market="Crypto" onclick="selectFormMarket('Crypto')">Crypto</button>
        <button type="button" class="choice" data-market="Forex" onclick="selectFormMarket('Forex')">Forex</button>
        <button type="button" class="choice" data-market="Commodities" onclick="selectFormMarket('Commodities')">Commodities</button>
      </div>
      <label class="form-label">Instrument Type</label>
      <div class="choice-row" id="instrumentChoices">
        <button type="button" class="choice active" data-value="Spot" onclick="selectInstrument('Spot')">Spot</button>
        <button type="button" class="choice" data-value="F&O" onclick="selectInstrument('F&O')">F&amp;O</button>
      </div>
      <label class="form-label">Direction</label>
      <div class="direction-row" id="directionChoices">
        <button type="button" class="choice active" data-value="Long" onclick="selectDirection('Long')">↗ Long</button>
        <button type="button" class="choice short" data-value="Short" onclick="selectDirection('Short')">↘ Short</button>
      </div>
      <label class="form-label" for="date">Entry Date &amp; Time</label>
      <input type="datetime-local" id="date" class="form-field" oninput="updatePreview()">
      <label class="form-label" for="exitDateTime">Exit Date &amp; Time</label>
      <input type="datetime-local" id="exitDateTime" class="form-field" oninput="updatePreview()">
      <label class="form-label" for="stock">Underlying</label>
      <input type="search" id="stock" class="form-field" list="underlyingOptions" placeholder="Stock / Pair / Coin name (e.g. AAPL, BTC/USD)">
      <datalist id="underlyingOptions"><option value="AAPL"><option value="BTC/USD"><option value="EUR/USD"><option value="Gold"></datalist>
      <div class="sell-head"><label class="form-label">Buys</label><button type="button" class="add-sell" onclick="addBuyRow()">+ Add Buy</button></div>
      <div id="buyRows"></div>
      <div class="sell-head"><label class="form-label">Sells</label><button type="button" class="add-sell" onclick="addSellRow()">+ Add Sell</button></div>
      <div id="sellRows"></div>
      <label class="form-label">Leverage (margin reference)</label>

<script>
function backupData() {
  const blob = new Blob([JSON.stringify(trades)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'journal-backup.json';
  a.click();
}
function restoreData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw 0;
      trades = data.filter(t => t && t.date);
      save(); render();
      alert('backup restore ho gaya');
    } catch(e) { alert('ye backup file nahi hai'); }
  };
  reader.readAsText(file);
}
</script>
<script>
let trades = JSON.parse(localStorage.getItem('trades')) || [];
trades = trades.filter(t => t && t.date);
let market = 'Forex', chart = null, stockChart = null, editIndex = null;
const $ = id => document.getElementById(id);
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function save() {
  localStorage.setItem('trades', JSON.stringify(trades));
  if (currentUser && !syncing) { for (const t of trades) pushTrade(t); }
}

function openForm() {
  $('formOverlay').classList.add('open');
  if (!$('date').value) $('date').value = localDateTimeValue();
  if (!$('buyRows').children.length) addBuyRow();
  if (!$('sellRows').children.length) addSellRow();
  renderPhotoList();
  updatePreview();
}
function localDateTimeValue() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
let formMarket = 'Stock', instrumentType = 'Spot', direction = 'Long', leverage = 1, tradeImagesData = [];
function selectFormMarket(value) {
  formMarket = value;
  document.querySelectorAll('#formMarkets .choice').forEach(b => b.classList.toggle('active', b.dataset.market === value));
}
function selectInstrument(value) {
  instrumentType = value;
  document.querySelectorAll('#instrumentChoices .choice').forEach(b => b.classList.toggle('active', b.dataset.value === value));
}
function selectDirection(value) {
  direction = value;
  document.querySelectorAll('#directionChoices .choice').forEach(b => b.classList.toggle('active', b.dataset.value === value));
  updatePreview();
}
function selectLeverage(value) {
  leverage = value;
  document.querySelectorAll('#leverageChoices .choice').forEach(b => b.classList.toggle('active', Number(b.dataset.value) === value));
  updatePreview();
}
function addBuyRow(price = '', quantity = '') {
  const row = document.createElement('div');
  row.className = 'sell-row';
  row.innerHTML = '<div><label class="form-label">Buy Price</label><input class="buy-price" type="number" min="0" step="0.01" placeholder="0.00" value="' + price + '" oninput="updatePreview()"></div>' +
    '<div><label class="form-label">Qty</label><input class="buy-qty" type="number" min="0" step="any" placeholder="0" value="' + quantity + '" oninput="updatePreview()"></div>' +
    '<button type="button" class="remove-sell" aria-label="Remove buy" onclick="this.parentElement.remove();updatePreview()">−</button>';
  $('buyRows').appendChild(row);
  updatePreview();
}
function collectRows(containerId, priceClass, qtyClass) {
  return Array.from(document.querySelectorAll('#' + containerId + ' .sell-row')).map(row => ({
    price: Number(row.querySelector('.' + priceClass).value), quantity: Number(row.querySelector('.' + qtyClass).value)
  }));
}
function calculateTrade() {
  const buys = collectRows('buyRows', 'buy-price', 'buy-qty');
  const sells = collectRows('sellRows', 'sell-price', 'sell-qty');
  const buyQty = buys.reduce((sum, b) => sum + (b.quantity || 0), 0);
  const sellQty = sells.reduce((sum, s) => sum + (s.quantity || 0), 0);
  const buyValue = buys.reduce((sum, b) => sum + (b.price || 0) * (b.quantity || 0), 0);
  const sellValue = sells.reduce((sum, s) => sum + (s.price || 0) * (s.quantity || 0), 0);
  const entryQty = direction === 'Long' ? buyQty : sellQty;
  const exitQty = direction === 'Long' ? sellQty : buyQty;
  const avgBuy = buyQty ? buyValue / buyQty : 0;
  const avgSell = sellQty ? sellValue / sellQty : 0;
  const matchedQty = Math.min(entryQty, exitQty);
  const gross = (avgSell - avgBuy) * matchedQty;
  const fees = Math.max(0, Number($('brokerage').value) || 0);
  const net = gross - fees;
  return { buys, sells, buyQty, sellQty, entryQty, exitQty, buyValue, sellValue, avgBuy, avgSell, matchedQty, gross, fees, net };
}
function updatePreview() {
  if (!$('totalQty') || !$('netPnl')) return;
  const calc = calculateTrade();
  $('totalQty').innerText = calc.entryQty + ' entry / ' + calc.exitQty + ' exit';
  $('netPnl').innerText = calc.net.toFixed(2);
  $('netPnl').style.color = calc.net >= 0 ? '#3fb950' : '#f85149';
}
function handleTradeImages(input) {
  const files = Array.from(input.files || []);
  if (files.length + tradeImagesData.length > 3) { alert('max 3 photos add kar sakte ho'); input.value = ''; return; }
  const maxSize = 3 * 1024 * 1024;
  const invalid = files.find(f => !f.type.startsWith('image/') || f.size > maxSize);
  if (invalid) { alert('sirf image files, max 3MB each'); input.value = ''; return; }
  Promise.all(files.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 1280 / Math.max(image.width, image.height));
        canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        let quality = 0.72, data = canvas.toDataURL('image/jpeg', quality);
        while (data.length > 200000 && quality > 0.3) { quality -= 0.1; data = canvas.toDataURL('image/jpeg', quality); }
        if (data.length > 200000) { reject(new Error('image too large after optimization')); return; }
        resolve({ name: file.name, data });
      };
      image.onerror = reject;
      image.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  }))).then(items => { tradeImagesData = tradeImagesData.concat(items); renderPhotoList(); input.value = ''; }).catch(() => alert('photo optimize nahi ho paya, smaller photo try karo'));
}
function renderPhotoList() {
  const list = $('photoList');
  if (!tradeImagesData.length) { list.innerHTML = '<div class="photo-empty">No photos added</div>'; return; }
  list.innerHTML = tradeImagesData.map((photo, i) => '<div class="photo-preview"><img src="' + photo.data + '" alt="Trade photo"><button type="button" aria-label="Remove photo" onclick="tradeImagesData.splice(' + i + ',1);renderPhotoList()">×</button></div>').join('');
}
function addSellRow(price = '', quantity = '') {
  const row = document.createElement('div');
  row.className = 'sell-row';
  row.innerHTML = '<div><label class="form-label">Sell Price</label><input class="sell-price" type="number" min="0" step="0.01" placeholder="0.00" value="' + price + '" oninput="updatePreview()"></div>' +
    '<div><label class="form-label">Qty</label><input class="sell-qty" type="number" min="0" step="any" placeholder="0" value="' + quantity + '" oninput="updatePreview()"></div>' +
    '<button type="button" class="remove-sell" aria-label="Remove sell" onclick="this.parentElement.remove();updatePreview()">−</button>';
  $('sellRows').appendChild(row);
  updatePreview();
}
function closeForm() {
  $('formOverlay').classList.remove('open');
  $('date').value = '';
  $('exitDateTime').value = '';
  $('stock').value = '';
  $('buyRows').innerHTML = '';
  $('sellRows').innerHTML = '';
  $('brokerage').value = '';
  $('strategy').value = '';
  $('entryCondition').value = '';
  $('exitCondition').value = '';
  $('learning').value = '';
  tradeImagesData = [];
  renderPhotoList();
  leverage = 1; selectLeverage(leverage);
  formMarket = 'Stock'; instrumentType = 'Spot'; direction = 'Long';
  selectFormMarket(formMarket); selectInstrument(instrumentType); selectDirection(direction);
  editIndex = null;
  $('formTitle').innerText = 'New Journal';
  $('saveBtn').innerText = 'Save Journal';
}

function addTrade() {
  const entryDateTime = $('date').value, exitDateTime = $('exitDateTime').value, stock = $('stock').value.trim();
  const calc = calculateTrade();
  if (!entryDateTime || !stock || !calc.entryQty || !calc.exitQty || calc.entryQty < calc.exitQty || calc.buys.some(b => !b.price || !b.quantity) || calc.sells.some(s => !s.price || !s.quantity)) {
    alert('entry date-time, underlying, valid buy/sell price aur qty bharo; exit qty entry qty se zyada nahi ho sakti'); return;
  }
  const qty = calc.exitQty;
  const buy = calc.avgBuy, sell = calc.avgSell, profit = calc.net;
  const date = entryDateTime.slice(0, 10);
  const t = { id: 'trade_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), date, entryDateTime, exitDateTime, stock, qty, buy, sell, profit, grossProfit: calc.gross, brokerage: calc.fees, market: formMarket, instrumentType, direction, leverage, buys: calc.buys, sells: calc.sells, entryCondition: $('entryCondition').value.trim(), exitCondition: $('exitCondition').value, strategy: $('strategy').value, learning: $('learning').value.trim(), photos: tradeImagesData.slice() };
  if (editIndex === null) trades.push(t);
  else trades[editIndex] = t;
  market = formMarket;
  save();
  closeForm();
  render();
}

function deleteTrade(i) {
  if (!confirm('delete?')) return;
  const t = trades[i];
  if (currentUser && t) {
    const id = t.id || (t.date + '_' + t.stock + '_' + t.buy + '_' + t.sell + '_' + t.qty);
    removeTrade(id);
  }
  trades.splice(i, 1);
  save();
  render();
}

function marketMatches(t, selected) {
  if (t.market === selected) return true;
  return selected === 'Stock' && t.market === 'Stock/F&O';
}
function setMarket(m, btn) {
  market = m;
  document.querySelectorAll('#page-home .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#page-home .tab').forEach(b => b.classList.toggle('active', b.textContent.trim() === m));
  render();
}

function goSettings() {
  go('settings', document.querySelector('.bottomnav button[data-page="profile"]'));
}
function showStrategies() {
  const counts = {};
  trades.forEach(t => { if (t.strategy) counts[t.strategy] = (counts[t.strategy] || 0) + 1; });
  const names = Object.keys(counts).sort();
  alert(names.length ? 'Strategies in your journal:\n' + names.map(name => name + ': ' + counts[name] + (counts[name] === 1 ? ' trade' : ' trades')).join('\n') : 'Abhi journal me koi strategy-tagged trade nahi hai');
}
function showAppInfo() {
  alert('Trading Journal\nTrades browser storage me save hote hain aur signed-in account ke saath cloud sync hota hai. CSV export aur JSON backup/restore Settings me available hain.');
}
function go(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-' + page).classList.add('active');
  document.body.classList.toggle('profile-view', page === 'profile');
  document.querySelectorAll('.bottomnav button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (page === 'dashboard') drawCharts();
  if (page === 'journal') renderJournal();
}

async function shareText(title, text) {
  try {
    if (navigator.share) {
      await navigator.share({ title, text });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      alert('Text copy ho gaya. Ab ise apne preferred app me paste karke share kar sakte ho.');
    } else {
      prompt('Is text ko copy karke share karo:', text);
    }
  } catch (err) {
    if (err && err.name !== 'AbortError') alert('Share open nahi ho paya.');
  }
}
function shareApp() {
  shareText('Trading Journal', 'Trading Journal app: ' + location.href);
}
function requestFeature() {
  const message = prompt('Kaunsa feature chahiye?');
  if (message && message.trim()) shareText('Feature request for Trading Journal', 'Feature request: ' + message.trim());
}
function reportBug() {
  const message = prompt('Bug kya aa raha hai?');
  if (message && message.trim()) shareText('Bug report for Trading Journal', 'Bug report: ' + message.trim());
}

function toggleDetail(el) { el.querySelector('.day-detail').style.display = el.querySelector('.day-detail').style.display === 'block' ? 'none' : 'block'; }

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}
function tradeMeta(t) {
  const parts = [];
  if (t.direction || t.instrumentType) parts.push([t.direction, t.instrumentType].filter(Boolean).join(' · '));
  if (t.entryDateTime) parts.push('entry ' + escapeHtml(t.entryDateTime.replace('T', ' ')));
  if (t.exitDateTime) parts.push('exit ' + escapeHtml(t.exitDateTime.replace('T', ' ')));
  if (t.strategy) parts.push('strategy ' + escapeHtml(t.strategy));
  if (t.leverage) parts.push(escapeHtml(t.leverage) + 'x');
  if (Array.isArray(t.buys) && t.buys.length) parts.push('buys ' + t.buys.map(b => escapeHtml(b.quantity) + ' × ' + escapeHtml(b.price)).join(', '));
  if (Array.isArray(t.sells) && t.sells.length) parts.push('sells ' + t.sells.map(s => escapeHtml(s.quantity) + ' × ' + escapeHtml(s.price)).join(', '));
  if (t.brokerage) parts.push('fees ' + escapeHtml(t.brokerage));
  if (t.entryCondition) parts.push('entry: ' + escapeHtml(t.entryCondition));
  if (t.exitCondition) parts.push('exit: ' + escapeHtml(t.exitCondition));
  if (t.learning) parts.push(escapeHtml(t.learning));
  return parts.length ? '<div class="dow">' + parts.join(' · ') + '</div>' : '';
}
function renderJournal() {
  const list = $('journalList');
  list.innerHTML = '';
  const visible = trades.map((t, i) => ({ t, i })).filter(({ t }) => marketMatches(t, market)).reverse();
  if (!visible.length) {
    list.innerHTML = '<div class="card sub">Koi trade nahi. + button se add karo</div>';
    return;
  }
  visible.forEach(({ t, i }) => {
    const row = document.createElement('div');
    row.className = 'trade-row';
    row.innerHTML =
      '<div>' + escapeHtml(t.stock) + ' <span style="color:#8b949e">x' + escapeHtml(t.qty) + '</span><div class="dow">' + escapeHtml(t.date) + '</div>' + tradeMeta(t) + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<b class="' + (t.profit >= 0 ? 'profit' : 'loss2') + '">' + (t.profit >= 0 ? '$' : '$-') + Math.abs(t.profit).toFixed(2) + '</b>' +
      '<span class="del" onclick="deleteTrade(' + i + ')" style="color:#f85149;font-weight:700;cursor:pointer">X</span></div>';
    list.appendChild(row);
  });
}

function render() {
  const list = $('dayList');
  list.innerHTML = '';
  // sirf is market ke trades
  const visible = trades.map((t, i) => ({ t, i })).filter(({ t }) => marketMatches(t, market));

  // date ke hisaab se group karo
  const groups = {};
  visible.forEach(({ t, i }) => {
    if (!groups[t.date]) groups[t.date] = [];
    groups[t.date].push({ t, i });
  });

  Object.keys(groups).sort().reverse().forEach(date => {
    const dayTrades = groups[date];
    const dayTotal = dayTrades.reduce((s, { t }) => s + t.profit, 0);
    const d = new Date(date);

    const box = document.createElement('div');
    box.className = 'day' + (dayTotal < 0 ? ' loss' : '');
    box.innerHTML =
      '<div class="d">' + date.split('-').reverse().join('-') + '<div class="dow">' + DAYS[d.getDay()] + '</div></div>' +
      '<div class="p ' + (dayTotal >= 0 ? 'profit' : 'loss2') + '">' + (dayTotal >= 0 ? '$' : '$-') + Math.abs(dayTotal).toFixed(2) +
      '<div class="n">' + dayTrades.length + ' Trades</div></div>';

    // click karo toh us din ke trades dikhenge
    const detail = document.createElement('div');
    detail.className = 'day-detail';
    dayTrades.forEach(({ t, i }) => {
      const row = document.createElement('div');
      row.className = 'trade-row';
      row.innerHTML = '<span>' + escapeHtml(t.stock) + ' x' + escapeHtml(t.qty) + ' <button style="width:auto;padding:3px 8px;background:#b62324" onclick="event.stopPropagation();deleteTrade(' + i + ')">X</button>' + tradeMeta(t) + '</span>' +
        '<span class="' + (t.profit >= 0 ? 'profit' : 'loss2') + '">' + t.profit.toFixed(2) + '</span>';
      detail.appendChild(row);
    });
    detail.style.display = 'none';
    box.appendChild(detail);
    box.onclick = () => toggleDetail(box);
    list.appendChild(box);
  });

  // stats
  let total = 0, wins = 0;
  trades.forEach(t => { total += t.profit; if (t.profit >= 0) wins++; });
  const winRate = trades.length ? Math.round(wins / trades.length * 100) : 0;
  $('stats').innerHTML =
    '<div class="stat"><div class="num">' + trades.length + '</div><div class="lbl">Trades</div></div>' +
    '<div class="stat"><div class="num ' + (total >= 0 ? 'profit' : 'loss2') + '">' + total.toFixed(0) + '</div><div class="lbl">Total P/L</div></div>' +
    '<div class="stat"><div class="num">' + winRate + '%</div><div class="lbl">Win rate</div></div>' +
    '<div class="stat"><div class="num profit">' + (trades.length ? Math.max(...trades.map(t => t.profit)).toFixed(0) : '-') + '</div><div class="lbl">Best trade</div></div>';
}

function drawCharts() {
  const monthly = {};
  for (const t of trades) { const m = t.date.slice(0, 7); monthly[m] = (monthly[m] || 0) + t.profit; }
  const labels = Object.keys(monthly).sort();
  const values = labels.map(m => monthly[m]);

  if (chart) chart.destroy();
  chart = new Chart($('chart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'P/L', data: values, maxBarThickness: 50,
      backgroundColor: values.map(v => v >= 0 ? '#3fb950' : '#f85149') }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#e6edf3' } }, y: { ticks: { color: '#e6edf3' } } } }
  });

  const byStock = {};
  for (const t of trades) byStock[t.stock] = (byStock[t.stock] || 0) + t.profit;
  const sL = Object.keys(byStock), sV = sL.map(s => byStock[s]);

  if (stockChart) stockChart.destroy();
  stockChart = new Chart($('stockChart'), {
    type: 'bar',
    data: { labels: sL, datasets: [{ label: 'P/L', data: sV, maxBarThickness: 50,
      backgroundColor: sV.map(v => v >= 0 ? '#3fb950' : '#f85149') }] },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#e6edf3' } }, y: { ticks: { color: '#e6edf3' } } } }
  });
}

function downloadCSV() {
  let csv = 'Date,Stock,Qty,Buy,Sell,Profit,Market\n';
  for (const t of trades) csv += [t.date, t.stock, t.qty, t.buy, t.sell, t.profit, t.market].join(',') + '\n';
  const blob = new Blob([csv], { type: 'text/csv' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'trades.csv';
  link.click();
}

  const reader = new FileReader();

      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw 0;
      trades = data.filter(t => t && t.date);
      save(); render();
      alert('backup restore ho gaya');
    } catch(e) { alert('ye backup file nahi hai'); }
  };
  reader.readAsText(file);
}

const auth = firebase.auth(), db = firebase.firestore();
let currentUser = null, syncing = false;

function lockUI(show) {
  document.getElementById('lockScreen').style.display = show ? 'flex' : 'none';
  document.getElementById('fab').style.display = show ? 'none' : '';
  document.querySelector('.bottomnav').style.display = show ? 'none' : '';
}
function authMsg(t){ document.getElementById('authHint').innerText = t; }
function doLogout() { auth.signOut(); }

async function doSignup() {
  const e = document.getElementById('emailInput').value.trim(), p = document.getElementById('passInput').value;
  if (!e || p.length < 6) { authMsg('email dalo aur password 6+ letters ka'); return; }
  try { await auth.createUserWithEmailAndPassword(e, p); }
  catch(err) { authMsg(err.code=='auth/email-already-in-use' ? 'ye email pehle se hai, login karo' : 'error: ' + err.message); }
}
async function doLogin() {
  const e = document.getElementById('emailInput').value.trim(), p = document.getElementById('passInput').value;
  if (!e || !p) { authMsg('email aur password dono dalo'); return; }
  try { await auth.signInWithEmailAndPassword(e, p); }
  catch(err) { authMsg(err.code=='auth/invalid-credential' ? 'galat email ya password' : 'error: ' + err.message); }
}

auth.onAuthStateChanged(u => {
  if (u) {
    currentUser = u;
    lockUI(false);
    const ue = document.getElementById('userEmail'); if (ue) ue.innerText = 'login: ' + u.email;
    const pe = document.getElementById('profileEmail'); if (pe) pe.innerText = u.email || 'Signed in';
    loadCloud();
  } else {
    currentUser = null;
    lockUI(true);
    authMsg('');
  }
});

async function loadCloud() {
  if (!currentUser) return;
  syncing = true;
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('trades').get();
    const cloud = snap.docs.map(d => d.data());
    if (cloud.length) { trades = cloud.filter(t => t && t.date); localStorage.setItem('trades', JSON.stringify(trades)); }
    else if (trades.length) { for (const t of trades) await pushTrade(t); }
    render();
  } catch(e) { console.warn(e); }
  syncing = false;
}
async function pushTrade(t) {
  if (!currentUser) return;
  const id = t.id || (t.date + '_' + t.stock + '_' + t.buy + '_' + t.sell + '_' + t.qty);
  await db.collection('users').doc(currentUser.uid).collection('trades').doc(id).set(t);
}
async function removeTrade(id) {
  if (!currentUser) return;
  await db.collection('users').doc(currentUser.uid).collection('trades').doc(id).delete();
}
